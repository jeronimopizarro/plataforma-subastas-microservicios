server:
  port: 9000

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD (JWT)
# ===================================================================
jwt:
  # Lee la clave desde la variable de entorno de tu PC/Servidor
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

# 1. Configuración de Swagger: El navegador solo verá rutas limpias de negocio
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    urls:
      - name: 🛒 Servicio Subastas
        url: /docs/subastas
      - name: 💳 Servicio Wallet
        url: /docs/wallet
      - name: 🔨 Servicio Bidding
        url: /docs/bidding

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        # ===================================================================
        # ENMASCARAMIENTO DE DOCUMENTACIÓN (Sin "v3" ni nombres internos)
        # ===================================================================
        - id: docs-subastas
          uri: http://localhost:8080
          predicates:
            - Path=/docs/subastas
          filters:
            # Reemplaza la ruta externa completa por la ruta interna que el microservicio entiende
            - SetPath=/v3/api-docs

        - id: docs-wallet
          uri: http://localhost:8081
          predicates:
            - Path=/docs/wallet
          filters:
            - SetPath=/v3/api-docs

        - id: docs-bidding
          uri: http://localhost:8082
          predicates:
            - Path=/docs/bidding
          filters:
            - SetPath=/v3/api-docs

        # ===================================================================
        # RUTAS DE NEGOCIO (Tus rutas funcionales)
        # ===================================================================
        - id: route-subastas
          uri: http://localhost:8080
          predicates:
            - Path=/auctions/**, /products/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"

        - id: route-wallet
          uri: http://localhost:8081
          predicates:
            - Path=/wallets/**, /transactions/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@userKeyResolver}"

        - id: route-bidding
          uri: http://localhost:8082
          predicates:
            - Path=/bids/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: route-bidding-ws
          uri: ws://localhost:8082
          predicates:
            - Path=/ws-bidding/**