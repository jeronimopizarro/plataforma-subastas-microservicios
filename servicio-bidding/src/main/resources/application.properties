spring.application.name=servicio-bidding
server.port=8082

# Timeout para Feign
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bidding_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate creará la tabla automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activar OkHttp para que Feign soporte el método PATCH
spring.cloud.openfeign.okhttp.enabled=true

# Formato de log personalizado para incluir el Correlation ID
logging.pattern.level=%5p [TraceId: %X{correlationId:-NO-ID}]

# --- CIRCUIT BREAKER: Configuración para el servicio de Subastas ---

# 1. ¿Cuántas peticiones miramos para calcular el porcentaje? (Las últimas 5)
resilience4j.circuitbreaker.instances.subastas.sliding-window-size=5

# 2. ¿Con qué porcentaje de fallos salta la llave a OPEN? (Si 50% o más fallan)
resilience4j.circuitbreaker.instances.subastas.failure-rate-threshold=50

# 3. ¿Cuánto tiempo se queda en OPEN antes de intentar probar si Subastas revivió (HALF-OPEN)? (10 segundos)
resilience4j.circuitbreaker.instances.subastas.wait-duration-in-open-state=10s

# 4. Cuando está en HALF-OPEN, ¿cuántas peticiones deja pasar para probar? (Dejamos pasar 2)
resilience4j.circuitbreaker.instances.subastas.permitted-number-of-calls-in-half-open-state=2

# No considerar nuestras excepciones de negocio como fallos de la red
resilience4j.circuitbreaker.instances.subastas.ignore-exceptions=com.portafolio.bidding.domain.exception.DomainException