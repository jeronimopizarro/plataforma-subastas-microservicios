spring.application.name=servicio-bidding
server.port=8082

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# mysql-db, createDatabaseIfNotExist y password123
spring.datasource.url=jdbc:mysql://mysql-db:3306/bidding_db?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.cloud.openfeign.okhttp.enabled=true
logging.pattern.level=%5p [TraceId: %X{correlationId:-NO-ID}]

resilience4j.circuitbreaker.instances.subastas.sliding-window-size=5
resilience4j.circuitbreaker.instances.subastas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subastas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.subastas.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.subastas.ignore-exceptions=com.portafolio.bidding.domain.exception.DomainException

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest