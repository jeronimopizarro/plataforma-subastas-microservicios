server:
  port: 9000

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD (JWT)
# ===================================================================
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    urls:
      - name: 🛒 Servicio Subastas
        url: /docs/subastas
      - name: 💳 Servicio Wallet
        url: /docs/wallet
      - name: 🔨 Servicio Bidding
        url: /docs/bidding
      - name: 👤 Servicio Usuarios
        url: /docs/usuarios

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      routes:
        - id: docs-subastas
          uri: http://servicio-subastas:8080
          predicates:
            - Path=/docs/subastas
          filters:
            - SetPath=/v3/api-docs

        - id: docs-wallet
          uri: http://servicio-wallet:8081
          predicates:
            - Path=/docs/wallet
          filters:
            - SetPath=/v3/api-docs

        - id: docs-bidding
          uri: http://servicio-bidding:8082
          predicates:
            - Path=/docs/bidding
          filters:
            - SetPath=/v3/api-docs

        - id: docs-usuarios
          uri: http://servicio-usuarios:8083
          predicates:
            - Path=/docs/usuarios
          filters:
            - SetPath=/v3/api-docs

        - id: route-subastas
          uri: http://servicio-subastas:8080
          predicates:
            - Path=/auctions/**, /products/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"

        - id: route-wallet
          uri: http://servicio-wallet:8081
          predicates:
            - Path=/wallets/me/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@userKeyResolver}"

        - id: route-bidding
          uri: http://servicio-bidding:8082
          predicates:
            - Path=/bids/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: route-usuarios
          uri: http://servicio-usuarios:8083
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"

        - id: route-bidding-ws
          uri: ws://servicio-bidding:8082
          predicates:
            - Path=/ws-bidding/**