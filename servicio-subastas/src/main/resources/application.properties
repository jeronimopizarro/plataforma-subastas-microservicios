spring.application.name=servicio-subastas

spring.datasource.url=jdbc:mysql://localhost:3306/subastas_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

logging.pattern.level=%5p [TraceId: %X{correlationId:-NO-ID}]

# --- Configuración de Swagger / OpenAPI ---
# Ruta para acceder a la interfaz gráfica
springdoc.swagger-ui.path=/swagger-ui.html
# Mostrar las operaciones ordenadas alfabéticamente
springdoc.swagger-ui.operations-sorter=alpha    